<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrida de Digitação - Arena Distribuída</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Corrida de Digitação 🏎️</h1>
      <p id="status-conexao">Conectando...</p>
    </header>

    <main>
      <section id="tela-login" class="card">
        <h2>Entrar na Partida</h2>
        <div class="form-group">
          <label for="nome">Apelido:</label>
          <input type="text" id="nome" value="Jogador">
        </div>
        <div class="form-group">
          <label for="sala">Código da Sala:</label>
          <input type="text" id="sala" value="SALA1">
        </div>
        <button id="btn-entrar" class="btn-primary">Entrar na Sala</button>
      </section>

      <section id="tela-jogo" class="card hidden">
        <div class="info-bar">
          <div><strong>Função:</strong> <span id="meu-papel" class="badge">-</span></div>
          <div><strong>Sala:</strong> <span id="id-sala">-</span></div>
        </div>

        <h3>Participantes Conectados</h3>
        <ul id="lista-jogadores" class="player-list"></ul>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
